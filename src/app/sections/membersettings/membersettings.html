<div class="row content-container">
  <div class="col-12">
    <div class="row">
      <div class="content-container col-12 pb-4">
        <div class="row pt-4">
          <div class="col-1"></div>
          <div class="col-10">
            <h3 class="pb-3">My Settings</h3>
            <hr style="margin-top: 0px" />
            <div class="mt-2">
              <input
                #rating
                placeholder="Minimum Rating"
                type="number"
                id="rating"
                name="rating"
                min="1"
                max="10"
                step="0.1"
                style="width: 100px"
                [value]="getUserSettings[0]?.minpostrating ?? ''"
                (input)="onPostRatingChange(rating)"
              />
              <div class="form-check form-switch ms-2 mt-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="noratings"
                  [checked]="getUserSettings[0]?.showunrated === 1"
                  (change)="
                    getUserSettings &&
                      (getUserSettings[0].showunrated = $any($event.target).checked ? 1 : 0)
                  "
                />
                <label class="form-check-label ms-2 mt-2" for="nocomments"
                  ><p>Show posts with no ratings</p></label
                >
              </div>
              <div class="form-check form-switch ms-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="addnewusers"
                  [checked]="getUserSettings[0]?.addnewusers === 1"
                  (change)="
                    getUserSettings &&
                      (getUserSettings[0].addnewusers = $any($event.target).checked ? 1 : 0)
                  "
                />
                <label class="form-check-label ms-2 mt-2" for="addnewusers"
                  ><p>Add new users to my feed</p></label
                >
              </div>
              <div class="form-check form-switch ms-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="addnewcategories"
                  [checked]="getUserSettings[0]?.addnewcatagories === 1"
                  (change)="
                    getUserSettings &&
                      (getUserSettings[0].addnewcatagories = $any($event.target).checked ? 1 : 0)
                  "
                />
                <label class="form-check-label ms-2 mt-2" for="addnewcategories"
                  ><p>Add new categories to my feed</p></label
                >
              </div>
              <button class="updatebtn btn btn-primary mt-2 mb-2 editcommentbtn">
                Update Settings
              </button>
            </div>
            <div class="row">
              <div class="col-12">
                <hr />
                <strong>Post Filters</strong>
                <p class="mt-2">
                  Select what specific categories and users you want to see in your feed.
                </p>
                <div class="row">
                  <div class="col-12">
                    <ul class="nav nav-tabs" role="tablist">
                      <li class="nav-item" role="presentation">
                        <a
                          class="nav-link active"
                          id="simple-tab-0"
                          data-bs-toggle="tab"
                          href="#simple-tabpanel-0"
                          role="tab"
                          aria-controls="simple-tabpanel-0"
                          aria-selected="true"
                          >Categories</a
                        >
                      </li>
                      <li class="nav-item" role="presentation">
                        <a
                          class="nav-link"
                          id="simple-tab-1"
                          data-bs-toggle="tab"
                          href="#simple-tabpanel-1"
                          role="tab"
                          aria-controls="simple-tabpanel-1"
                          aria-selected="false"
                          >Users</a
                        >
                      </li>
                    </ul>
                    <div class="tab-content pt-3" id="tab-content">
                      <div
                        class="tab-pane active ms-2"
                        id="simple-tabpanel-0"
                        role="tabpanel"
                        aria-labelledby="tab-0"
                      >
                        <div class="col-12 mb-4">
                          <button
                            type="button"
                            class="btn btn-success mt-2 me-1 editcommentbtn"
                            (click)="selectAllCategories()"
                          >
                            Select All Categories
                          </button>

                          <button
                            type="button"
                            class="btn btn-danger mt-2 editcommentbtn"
                            (click)="deselectAllCategories()"
                          >
                            Deselect All Categories
                          </button>
                        </div>

                        @for (theRecord of userSettingsCatagories; track $index) {
                          <div class="form-check ms-2">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              id="{{ theRecord.usersettingscatagoryid }}"
                              style="width: 40px"
                              [checked]="theRecord.selected === 1"
                              [value]="theRecord.userid"
                              (change)="theRecord.selected = $any($event.target).checked ? 1 : 0"
                            />
                            <label
                              class="form-check-label ms-2 mt-2"
                              for="{theRecord.usersettingsid}"
                              ><p>{{ theRecord.catagory }}</p></label
                            >
                          </div>
                        }
                      </div>
                      <div
                        class="tab-pane"
                        id="simple-tabpanel-1"
                        role="tabpanel"
                        aria-labelledby="tab-1"
                      >
                        <table class="table table-striped table-hover">
                          <thead class="custom-thead">
                            <tr>
                              <th scope="col">Author</th>
                              <th scope="col">Post</th>
                              <th scope="col">Catagory</th>
                              <th scope="col">Post Verbiage</th>
                              <th scope="col">Comment Verbiage</th>
                              <th scope="col">Rating</th>
                              <th scope="col">Comment Count</th>
                            </tr>
                          </thead>
                          <tbody>
                            <!-- 
                            @for (
                              theStat of getUserProfile.getCommentsMember;
                              track theStat.postcommentid
                            ) {
                              <tr>
                                <td style="white-space: nowrap">
                                  <a
                                    class="mt-3 me-1"
                                    title="View Posts"
                                    [attr.href]="'/posts?userguid=' + theStat.userguid"
                                    rel="noopener noreferrer"
                                  >
                                    {{ theStat.name }}
                                  </a>
                                </td>
                                <td style="white-space: nowrap">
                                  <a
                                    class="mt-3 me-1"
                                    title="View Post"
                                    [attr.href]="'/post?postguid=' + theStat.postguid"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                  >
                                    View Post
                                  </a>
                                </td>
                                <td>
                                  <a
                                    class="mt-3 me-1"
                                    title="View Posts"
                                    [attr.href]="'/posts?catagoryid=' + theStat.postcatagoryid"
                                  >
                                    {{ theStat.catagory }}
                                  </a>
                                </td>
                                <td><span innerHTML="{{ theStat.postshorttext }}"></span></td>
                                <td><span innerHTML="{{ theStat.commentshorttext }}"></span></td>
                                <td>{{ theStat.rating }}</td>
                                <td>{{ theStat.count }}</td>
                              </tr>
                            }
                          --></tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
