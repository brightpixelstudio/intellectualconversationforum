<div class="row content-container">
  <div class="col-12">
    <div class="row">
      <div class="content-container col-12 pb-4">
        <div class="row pt-4">
          <div class="col-1"></div>
          <div class="col-10">
            <h3 class="pb-3">My Settings</h3>
            <hr style="margin-top: 0px" />
            <div class="mt-2">
              <input
                #rating
                placeholder="Minimum Rating"
                type="number"
                id="rating"
                name="rating"
                min="1"
                max="10"
                step="0.1"
                style="width: 200px"
                (change)="onPostRatingChange(rating.value)"
              />
              <div class="form-check form-switch ms-2 mt-3">
                <input class="form-check-input" type="checkbox" id="nocomments" />
                <label class="form-check-label ms-2 mt-2" for="nocomments"
                  ><p>Show posts with no comments</p></label
                >
              </div>
              <div class="form-check form-switch ms-2">
                <input class="form-check-input" type="checkbox" id="addnewusers" />
                <label class="form-check-label ms-2 mt-2" for="addnewusers"
                  ><p>Add new users to my feed</p></label
                >
              </div>
              <div class="form-check form-switch ms-2">
                <input class="form-check-input" type="checkbox" id="addnewcategories" />
                <label class="form-check-label ms-2 mt-2" for="addnewcategories"
                  ><p>Add new categories to my feed</p></label
                >
              </div>
              <button class="updatebtn btn btn-primary mt-2 mb-2">Update Settings</button>
            </div>
            <div class="row">
              <div class="col-12">
                <hr />
                <strong>Post Filters</strong>
                <p class="mt-2">
                  Select what specific categories and users you want to see in your feed.
                </p>
                <div class="row">
                  <div class="col-12">
                    <ul class="nav nav-tabs" role="tablist">
                      <li class="nav-item" role="presentation">
                        <a
                          class="nav-link active"
                          id="simple-tab-0"
                          data-bs-toggle="tab"
                          href="#simple-tabpanel-0"
                          role="tab"
                          aria-controls="simple-tabpanel-0"
                          aria-selected="true"
                          >Categories</a
                        >
                      </li>
                      <li class="nav-item" role="presentation">
                        <a
                          class="nav-link"
                          id="simple-tab-1"
                          data-bs-toggle="tab"
                          href="#simple-tabpanel-1"
                          role="tab"
                          aria-controls="simple-tabpanel-1"
                          aria-selected="false"
                          >Users</a
                        >
                      </li>
                    </ul>
                    <div class="tab-content pt-3" id="tab-content">
                      <div
                        class="tab-pane active"
                        id="simple-tabpanel-0"
                        role="tabpanel"
                        aria-labelledby="tab-0"
                      >
                        <table class="table table-striped table-hover">
                          <thead class="custom-thead">
                            <tr>
                              <th scope="col">Post</th>
                              <th scope="col">Catagory</th>
                              <th scope="col">Post Verbiage</th>
                              <th scope="col">Rating</th>
                              <th scope="col">Comment Count</th>
                            </tr>
                          </thead>
                          <tbody>

                                <td>{{ theStat.rating }}</td>
                                <td>{{ theStat.count }}</td>
                              </tr>
                            }
                          --></tbody>
                        </table>
                      </div>
                      <div
                        class="tab-pane"
                        id="simple-tabpanel-1"
                        role="tabpanel"
                        aria-labelledby="tab-1"
                      >
                        <table class="table table-striped table-hover">
                          <thead class="custom-thead">
                            <tr>
                              <th scope="col">Author</th>
                              <th scope="col">Post</th>
                              <th scope="col">Catagory</th>
                              <th scope="col">Post Verbiage</th>
                              <th scope="col">Comment Verbiage</th>
                              <th scope="col">Rating</th>
                              <th scope="col">Comment Count</th>
                            </tr>
                          </thead>
                          <tbody>
                            <!--

                                <td>

                                  </a>

                                <td><span innerHTML="{{ theStat.postshorttext }}"></span></td>
                                <td><span innerHTML="{{ theStat.commentshorttext }}"></span></td>

                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
