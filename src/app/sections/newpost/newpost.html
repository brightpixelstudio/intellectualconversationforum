<div class="row content-container">
  <div class="col-12">
    <div class="row">
      <div class="content-container col-12 pb-4">
        <div class="row pt-4">
          <div class="col-1"></div>
          <div class="col-10">
            <h3 class="pb-3">Create Post</h3>
            <p>Create a new post below:</p>
            <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
              <select
                #catagory
                name="catagory"
                id="catagory"
                class="me-2"
                formControlName="catagoryid"
              >
                @for (catagory of catagoryList; track catagory.postcatagoryid) {
                  <option [value]="catagory.postcatagoryid">{{ catagory.catagory }}</option>
                }
              </select>
              <select #user name="user" id="user" formControlName="userid">
                @for (user of userList; track user.userid) {
                  <option [value]="user.userid">{{ user.name }}</option>
                }
              </select>
              <br />
              <quill-editor
                [modules]="modules"
                id="post"
                maxlength="5000"
                required
                formControlName="post"
                placeholder="Post..."
                class="form-control"
                class="mt-3"
                (onContentChanged)="checkQuillLength($event)"
              ></quill-editor>
              <div class="character-counter">{{ currentQuillLength }} / {{ maxLimit }}</div>
              @if (f['post'].touched && f['post'].errors?.['profanity']) {
                <div class="error-message">Please remove inappropriate language.</div>
              }

              <!-- Disable submit button if form rules aren't met -->
              <button type="submit" [disabled]="postForm.invalid" class="btn btn-primary mt-4">
                Create Post!
              </button>

              <a class="btn actionbtn editBtn" title="Return to Posts" [attr.href]="'/posts'">
                <p class="return mt-5 ms-3">Return To Posts</p>
              </a>

              @if (showSuccess == true) {
                <div class="successmsg">This post was added.</div>
              }
              @if (showError == true) {
                <div class="errormsg">{{ errorMsg }}.</div>
              }
            </form>
          </div>
          <div class="col-1"></div>
        </div>
      </div>
    </div>
  </div>
</div>
