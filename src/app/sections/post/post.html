<div class="row content-container">
  <div class="col-12">
    <div class="row">
      <div class="content-container col-12 pb-4">
        <div class="row pt-4">
          <div class="col-1"></div>
          <div class="col-10">
            <h3 class="pb-3">Post</h3>
            <p>View the post below:</p>
            <hr />
            <p class="title">
              <strong>{{ thePost?.name }}</strong
              >,<i>
                {{ thePost?.catagory }}, {{ thePost?.dateadded | date: 'mediumDate' }},
                {{ thePost?.count }} comments, {{ timePassed }}, {{ rating }} rating</i
              >
            </p>
            <hr />
            <div class="row">
              <div class="col-3 mt-2">
                <div
                  class="btn-toolbar"
                  role="toolbar"
                  aria-label="Rate this post"
                  (click)="onPostRatingToolbarClick($event, postguid)"
                >
                  <span class="mt-3"><p class="title">Rate:</p></span>
                  <div class="btn-group" role="group" aria-label="First group">
                    <button type="button" class="btn btn-primary ratingBtn">1</button>
                    <button type="button" class="btn btn-primary ratingBtn">2</button>
                    <button type="button" class="btn btn-primary ratingBtn">3</button>
                    <button type="button" class="btn btn-primary ratingBtn">4</button>
                    <button type="button" class="btn btn-primary ratingBtn">5</button>
                    <button type="button" class="btn btn-primary ratingBtn">6</button>
                    <button type="button" class="btn btn-primary ratingBtn">7</button>
                    <button type="button" class="btn btn-primary ratingBtn">8</button>
                    <button type="button" class="btn btn-primary ratingBtn">9</button>
                    <button type="button" class="btn btn-primary ratingBtn">10</button>
                  </div>
                </div>
              </div>
              <div class="col-2 mt-3">
                <select
                  #userid
                  name="userid"
                  id="userid"
                  class="userSelect"
                  (change)="onUserChange($event)"
                >
                  @for (user of userList; track user.userid) {
                    <option value="{{ user.userguid }}">{{ user.name }}</option>
                  }
                </select>
              </div>
              @if (showRatingSuccess == true) {
                <div class="successmsg">Your rating was succesfully saved</div>
              }
            </div>
            <div class="row">
              <div class="col-12">
                <p class="text-break">
                  <span [innerHTML]="thePost?.post"> </span>
                </p>
              </div>
            </div>
          </div>
          <div class="col-1"></div>
        </div>
      </div>
    </div>
  </div>
</div>
