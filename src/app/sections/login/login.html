<div class="row content-container">
  <div class="col-12">
    <div class="row">
      <div class="content-container col-12 pb-4">
        <div class="row pt-4">
          <div class="col-1"></div>

          <div class="col-4">
            <h3 class="pb-3">Login</h3>
            <p>Please sign in to your profile below:</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <input
                  style="min-width: 300px"
                  type="text"
                  id="login"
                  name="login"
                  required
                  autocomplete="username"
                  formControlName="login"
                  placeholder="Please enter a username or email address..."
                  class="form-control"
                />

                @if (f['login'].hasError('required') && f['login'].touched) {
                  <div class="error-message">Username or email address is required.</div>
                }
              </div>

              <div class="mb-3">
                <input
                  style="min-width: 300px"
                  type="password"
                  id="password"
                  name="password"
                  required
                  autocomplete="current-password"
                  formControlName="password"
                  placeholder="Please enter your password..."
                  class="form-control"
                />

                @if (f['password'].hasError('required') && f['password'].touched) {
                  <div class="error-message">Password is required.</div>
                }
              </div>

              <button
                type="submit"
                [disabled]="loginForm.invalid || isSubmitting"
                class="btn btn-primary mt-3"
              >
                {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
              </button>

              @if (showError) {
                <div class="errormsg mt-3" role="alert">
                  {{ errorMsg }}
                </div>
              }
            </form>
          </div>

          <div class="col-1"></div>
        </div>
      </div>
    </div>
  </div>
</div>
