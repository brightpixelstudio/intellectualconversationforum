<div class="row content-container">
  <div class="col-12">
    <div class="row">
      <div class="content-container col-12 pb-4">
        <div class="row pt-4">
          <div class="col-1"></div>
          <div class="col-10">
            <h3 class="pb-3">View and Submit Ideas / Bugs / Improvements</h3>
            <p>View and Submit a new request below</p>
            <input id="startdate" type="date" style="width: 20%" [(ngModel)]="startDate" />
            to
            <input id="enddate" type="date" style="width: 20%" [(ngModel)]="endDate" />
            <select id="IdeaType" class="ms-2"></select>
            <select id="IdeaStatus" class="ms-2"></select>
            <button type="button" class="btn btn-primary editcommentbtn mt-1 ms-3">
              View Submitted Requests
            </button>
            <button type="button" class="btn btn-success editcommentbtn mt-1 ms-3">
              New Request
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
