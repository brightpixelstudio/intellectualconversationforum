@if (getUserProfile?.getUserProfile) {
  <div class="row">
    <div class="col-12 offset-md-1">
      <memberprofile
        [getUserProfile]="getUserProfile.getUserProfile"
        [isAdmin]="false"
      ></memberprofile>

      <div class="mt-2">
        <button class="updatebtn btn btn-primary mt-2" (click)="editprofile()">
          Update Profile
        </button>
      </div>

      <memberactivity [memberProfile]="getUserProfile"></memberactivity>
    </div>
  </div>
}
