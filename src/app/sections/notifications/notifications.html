<div class="dropdown">
  <button
    class="btn btn-link position-relative notification-bell"
    [class.has-notifications]="unreadCount > 0"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
    title="Notifications"
    (click)="loadNotifications()"
  >
    <fa-icon [icon]="faBell"></fa-icon>

    @if (unreadCount > 0) {
      <span class="notification-badge">
        {{ unreadCount > 99 ? '99+' : unreadCount }}
      </span>
    }
  </button>
  <div class="dropdown-menu notification-dropdown">
    <div class="d-flex justify-content-between align-items-center px-3 py-2">
      Notifications

      @if (unreadCount > 0) {
        <button type="button" class="btn btn-success editcommentbtn" (click)="markAllAsRead()">
          Mark all as read
        </button>
      }
    </div>

    <hr class="my-1" />

    @if (loading) {
      <div class="p-3 text-center">Loading notifications...</div>
    } @else if (errorMessage) {
      <div class="p-3 text-danger">
        {{ errorMessage }}
      </div>
    } @else if (notifications.length === 0) {
      <div class="p-3 text-center text-muted">No notifications yet.</div>
    } @else {
      <div class="notification-list">
        @for (notification of notifications; track notification.notificationId) {
          <button
            type="button"
            class="dropdown-item notification-item d-flex align-items-start"
            [class.unread-notification]="!notification.isRead"
            (click)="selectNotification(notification)"
          >
            <img
              [src]="notification.profileImageUrl || '/images/default-profile.png'"
              class="notification-profile-image"
              alt="Profile"
            />
            <div class="flex-grow-1">
              <p class="mb-0 mt-1 notification-text">
                <strong>{{ notification.actorName }}</strong>
                <i> commented on the post, "{{ notification.postShortText }}"</i>
              </p>
            </div>

            <div class="ms-2 mt-1 flex-shrink-0 text-nowrap">
              <p style="font-size: 12px">{{ getTimeAgo(notification.dateCreated) }}</p>
            </div>
          </button>
        }
      </div>
    }
  </div>
</div>
