<table class="table table-striped table-hover">
  <thead class="custom-thead">
    <tr>
      <th scope="col">Comment Author</th>
      <th scope="col">Post Author</th>
      <th scope="col">Catagory</th>
      <th scope="col">Comment Verbiage</th>
      <th scope="col">Rating</th>
      <th scope="col">Date Added</th>
    </tr>
  </thead>
  <tbody>
    @for (theStat of comments; track theStat.postcommentid) {
      <tr>
        <td style="white-space: nowrap">
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?userguid=' + theStat.userguid"
            rel="noopener noreferrer"
          >
            {{ theStat.commentauthor }}
          </a>
        </td>
        <td style="white-space: nowrap">
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?userguid=' + theStat.postuserguid"
            rel="noopener noreferrer"
          >
            {{ theStat.postauthor }}
          </a>
        </td>
        <td>
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?catagoryid=' + theStat.postcatagoryid"
          >
            {{ theStat.catagory }}
          </a>
        </td>
        <td><span innerHTML="{{ theStat.commentshorttext }}"></span></td>
        <td>{{ theStat.rating }}</td>
        <td>{{ theStat.dateadded | date: 'mediumDate' }}</td>
      </tr>
    }
  </tbody>
</table>
