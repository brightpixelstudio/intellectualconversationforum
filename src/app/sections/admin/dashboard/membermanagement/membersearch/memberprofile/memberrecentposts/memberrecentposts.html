<table class="table table-striped table-hover">
  <thead class="custom-thead">
    <tr>
      <th scope="col">Post</th>
      <th scope="col">Catagory</th>
      <th scope="col">Post Verbiage</th>
      <th scope="col">Rating</th>
      <th scope="col">Comment Count</th>
      <th scope="col">Date Added</th>
    </tr>
  </thead>
  <tbody>
    @for (theStat of posts; track theStat.postid) {
      <tr>
        <td>
          <a
            class="mt-3 me-1"
            title="View Post"
            [attr.href]="'/post?postguid=' + theStat.postguid"
            target="_blank"
            rel="noopener noreferrer"
          >
            View Post
          </a>
        </td>
        <td>
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?catagoryid=' + theStat.postcatagoryid"
          >
            {{ theStat.catagory }}
          </a>
        </td>
        <td><span innerHTML="{{ theStat.shorttext }}"></span></td>
        <td>{{ theStat.rating }}</td>
        <td>{{ theStat.count }}</td>
        <td>{{ theStat.dateadded | date: 'mediumDate' }}</td>
      </tr>
    }
  </tbody>
</table>
