<membersearch (memberSelected)="loadMemberProfile($event)"> </membersearch>

  <memberprofile [userguid]="selectedUserGuid"> </memberprofile>

  @if (getUserProfile) {
    <memberupdate [member]="getUserProfile.getUserProfile">></memberupdate>

    <memberactivity [memberProfile]="getUserProfile"> </memberactivity>
  }
}
