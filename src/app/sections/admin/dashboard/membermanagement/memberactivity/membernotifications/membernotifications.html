<table class="table table-striped table-hover">
  <thead class="custom-thead">
    <tr>
      <th scope="col">Profile Image</th>
      <th scope="col">Author</th>
      <th scope="col">Action</th>
      <th scope="col">How Long Aog</th>
    </tr>
  </thead>
  <tbody>
    @for (theRecord of notifications; track theRecord.notificationId) {
      <tr>
        <td style="white-space: nowrap">
          <img
            [src]="theRecord.profileImageUrl || '/images/default-profile.png'"
            class="notification-profile-image"
            alt="Profile"
          />
        </td>
        <td>
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?userguid=' + theRecord.actorguid"
            rel="noopener noreferrer"
          >
            {{ theRecord.actorName }}
          </a>
        </td>
        <td>
          <p class="mb-0 mt-1 notification-text">
            <strong>{{ theRecord.actorName }}</strong>
            <i> commented on the post, "{{ theRecord.postShortText }}"</i>
          </p>
        </td>
        <td>
          <p>{{ getTimeAgo(theRecord.dateCreated) }}</p>
        </td>
      </tr>
    }
  </tbody>
</table>
