<hr />
<h5 class="pb-1">Activity</h5>
<div class="row">
  <div class="col-12 mt-3">
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <a
          class="nav-link active"
          id="member-tab-30"
          data-bs-toggle="tab"
          href="#member-tabpanel-30"
          role="tab"
          aria-controls="member-tabpanel-30"
          aria-selected="true"
          >Recent Posts</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-31"
          data-bs-toggle="tab"
          href="#member-tabpanel-31"
          role="tab"
          aria-controls="member-tabpanel-31"
          aria-selected="false"
          >Recent Comments</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-32"
          data-bs-toggle="tab"
          href="#member-tabpanel-32"
          role="tab"
          aria-controls="member-tabpanel-32"
          aria-selected="false"
          >Posts They Rated</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-33"
          data-bs-toggle="tab"
          href="#member-tabpanel-33"
          role="tab"
          aria-controls="member-tabpanel-33"
          aria-selected="false"
          >Comments They Rated</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-34"
          data-bs-toggle="tab"
          href="#member-tabpanel-34"
          role="tab"
          aria-controls="member-tabpanel-34"
          aria-selected="false"
          >Account Status History</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-35"
          data-bs-toggle="tab"
          href="#member-tabpanel-35"
          role="tab"
          aria-controls="member-tabpanel-35"
          aria-selected="false"
          >Notifications</a
        >
      </li>
    </ul>
    <div class="tab-content pt-3" id="tab-content">
      <div class="tab-pane active" id="member-tabpanel-30" role="tabpanel" aria-labelledby="tab-30">
        <memberrecentposts [posts]="memberProfile.getPostsMember"> </memberrecentposts>
      </div>
      <div class="tab-pane" id="member-tabpanel-31" role="tabpanel" aria-labelledby="tab-31">
        <memberrecentcomments [comments]="memberProfile.getCommentsMember"></memberrecentcomments>
      </div>
      <div class="tab-pane" id="member-tabpanel-32" role="tabpanel" aria-labelledby="tab-32">
        <memberpostratings [postRatings]="memberProfile.getPostRatingsMember"></memberpostratings>
      </div>
      <div class="tab-pane" id="member-tabpanel-33" role="tabpanel" aria-labelledby="tab-33">
        <membercommentratings
          [commentRatings]="memberProfile.getCommentRatingsMember"
        ></membercommentratings>
      </div>
      <div class="tab-pane" id="member-tabpanel-34" role="tabpanel" aria-labelledby="tab-34">
        <memberaccountstatushistory
          [accountStatusHistory]="memberProfile.getAccountStatusHistoryMember"
        ></memberaccountstatushistory>
      </div>
      <div class="tab-pane" id="member-tabpanel-35" role="tabpanel" aria-labelledby="tab-35">
        Notifications
      </div>
    </div>
  </div>
</div>
