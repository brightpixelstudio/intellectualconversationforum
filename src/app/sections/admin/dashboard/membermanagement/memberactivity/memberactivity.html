<hr />
<h5 class="pb-1">Activity</h5>
<div class="row">
  <div class="col-12 mt-3">
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <a
          class="nav-link active"
          id="member-tab-0"
          data-bs-toggle="tab"
          href="#member-tabpanel-0"
          role="tab"
          aria-controls="member-tabpanel-0"
          aria-selected="true"
          >Recent Posts</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-1"
          data-bs-toggle="tab"
          href="#member-tabpanel-1"
          role="tab"
          aria-controls="member-tabpanel-1"
          aria-selected="false"
          >Recent Comments</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-2"
          data-bs-toggle="tab"
          href="#member-tabpanel-2"
          role="tab"
          aria-controls="member-tabpanel-2"
          aria-selected="false"
          >Posts They Rated</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-3"
          data-bs-toggle="tab"
          href="#member-tabpanel-3"
          role="tab"
          aria-controls="member-tabpanel-3"
          aria-selected="false"
          >Comments They Rated</a
        >
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="member-tab-4"
          data-bs-toggle="tab"
          href="#member-tabpanel-4"
          role="tab"
          aria-controls="member-tabpanel-4"
          aria-selected="false"
          >Account Status History</a
        >
      </li>
    </ul>
    <div class="tab-content pt-3" id="tab-content">
      <div class="tab-pane active" id="member-tabpanel-0" role="tabpanel" aria-labelledby="tab-0">
        <memberrecentposts [posts]="memberProfile.getPostsMember"> </memberrecentposts>
      </div>
      <div class="tab-pane" id="member-tabpanel-1" role="tabpanel" aria-labelledby="tab-1">
        <memberrecentcomments [comments]="memberProfile.getCommentsMember"></memberrecentcomments>
      </div>
      <div class="tab-pane" id="member-tabpanel-2" role="tabpanel" aria-labelledby="tab-2">
        <memberpostratings [postRatings]="memberProfile.getPostRatingsMember"></memberpostratings>
      </div>
      <div class="tab-pane" id="member-tabpanel-3" role="tabpanel" aria-labelledby="tab-3">
        <membercommentratings
          [commentRatings]="memberProfile.getCommentRatingsMember"
        ></membercommentratings>
      </div>
      <div class="tab-pane" id="member-tabpanel-4" role="tabpanel" aria-labelledby="tab-4">
        <memberaccountstatushistory
          [accountStatusHistory]="memberProfile.getAccountStatusHistoryMember"
        ></memberaccountstatushistory>
      </div>
    </div>
  </div>
</div>
