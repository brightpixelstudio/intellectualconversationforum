<table class="table table-striped table-hover">
  <thead class="custom-thead">
    <tr>
      <th scope="col">Author</th>
      <th scope="col">Post</th>
      <th scope="col">Catagory</th>
      <th scope="col">Post Verbiage</th>
      <th scope="col">Average Rating</th>
      <th scope="col">Their Rating</th>
    </tr>
  </thead>
  <tbody>
    @for (theStat of postRatings; track theStat.postid) {
      <tr>
        <td style="white-space: nowrap">
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?userguid=' + theStat.postauthorguid"
            rel="noopener noreferrer"
          >
            {{ theStat.postauthorname }}
          </a>
        </td>
        <td style="white-space: nowrap">
          <a
            class="mt-3 me-1"
            title="View Post"
            [attr.href]="'/post?postguid=' + theStat.postguid"
            target="_blank"
            rel="noopener noreferrer"
          >
            View Post
          </a>
        </td>
        <td>
          <a
            class="mt-3 me-1"
            title="View Posts"
            [attr.href]="'/posts?catagoryid=' + theStat.postcatagoryid"
          >
            {{ theStat.postcatagory }}
          </a>
        </td>
        <td><span innerHTML="{{ theStat.postcontent }}"></span></td>
        <td>{{ theStat.postaveragerating }}</td>
        <td>{{ theStat.rating }}</td>
      </tr>
    }
  </tbody>
</table>
