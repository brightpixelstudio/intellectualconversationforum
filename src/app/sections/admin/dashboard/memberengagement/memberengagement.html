<div class="row">
  <div class="col-9 mb-3">
    <input id="startdate" type="date" style="width: 20%" [(ngModel)]="startDate" />
    to
    <input id="enddate" type="date" style="width: 20%" [(ngModel)]="endDate" />
  </div>
</div>

<div class="row">
  <div class="col-12 mt-3">
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <a
          class="nav-link active"
          id="site-tab-40"
          data-bs-toggle="tab"
          href="#site-tabpanel-40"
          role="tab"
          (shown.bs.tab)="activeTab = 'overview'"
        >
          Community Overview
        </a>
      </li>
      <li class="nav-item" role="presentation">
        <a
          class="nav-link"
          id="site-tab-41"
          data-bs-toggle="tab"
          href="#site-tabpanel-41"
          role="tab"
          (shown.bs.tab)="activeTab = 'participation'"
        >
          Member Participation
        </a>
      </li>
    </ul>
    <div class="tab-content pt-3" id="tab-content">
      <!-- Community Overview -->
      <div
        class="tab-pane fade show active"
        id="site-tabpanel-40"
        role="tabpanel"
        aria-labelledby="site-tab-40"
      >
        @if (activeTab === 'overview') {
          <communityoverview [startDate]="startDate" [endDate]="endDate"> </communityoverview>
        }
      </div>

      <!-- Member Participation -->
      <div
        class="tab-pane fade"
        id="site-tabpanel-41"
        role="tabpanel"
        aria-labelledby="site-tab-41"
      >
        @if (activeTab === 'participation') {
          <memberparticipation [startDate]="startDate" [endDate]="endDate"> </memberparticipation>
        }
      </div>
    </div>
  </div>
</div>
