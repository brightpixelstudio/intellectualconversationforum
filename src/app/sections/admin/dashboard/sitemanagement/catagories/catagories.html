<div class="row">
  <div class="col-6 mb-3">
    <input
      id="catagory"
      type="text"
      style="width: 70%"
      placeholder="Catagory name"
      [(ngModel)]="catagoryText"
      maxlength="30"
    />

    <button
      type="button"
      class="btn btn-primary editcommentbtn mt-1 ms-3"
      [disabled]="catagoryText.trim().length < 3"
      (click)="addCatagory()"
    >
      Add Catagory
    </button>
    <br />
    <small class="text-muted"><i>You must type at least 3 characters</i></small>
    @if (showSuccess == true) {
      <div class="successmsg">This catagory was added</div>
    }
    @if (showError == true) {
      <div class="errormsg">{{ errorMsg }}.</div>
    }
  </div>
</div>

<table class="table table-striped table-hover">
  <thead class="custom-thead">
    <tr>
      <th scope="col">Catagory</th>
      <th scope="col">Date Added</th>
    </tr>
  </thead>
  <tbody>
    @for (theRecord of getCatagories; track theRecord.postcatagoryid) {
      <tr>
        <td>
          {{ theRecord.catagory }}
        </td>
        <td>{{ theRecord.dateadded | date: 'mediumDate' }}</td>
      </tr>
    }
  </tbody>
</table>
